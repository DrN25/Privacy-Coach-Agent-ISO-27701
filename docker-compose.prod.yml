services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: privacy-coach:local
    container_name: privacy-coach-app
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_PATH: /var/data/empresa_conocimiento.db
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - privacy-coach-data:/var/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/src/data/uploads:size=128m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://0.0.0.0:8000/api/status', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  privacy-coach-data:
