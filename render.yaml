services:
  - type: web
    name: privacy-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeploy: false
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: /var/data/empresa_conocimiento.db
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
    disk:
      name: privacy-coach-data
      mountPath: /var/data
      sizeGB: 1
