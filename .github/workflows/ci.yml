name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src knowledge_base tests

      - name: Lint
        run: ruff check src knowledge_base tests

      - name: Test
        run: pytest

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan Python source
        run: bandit -q -r src -x tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: privacy-coach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production container
        run: |
          docker run --rm -d --name privacy-coach-ci -p 18000:8000 \
            -e DATABASE_PATH=/var/data/test.db \
            -e OPENROUTER_API_KEY=test-key \
            -e APP_USERNAME=auditor \
            -e APP_PASSWORD=secret \
            privacy-coach:${{ github.sha }}
          trap 'docker stop privacy-coach-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/api/status; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs privacy-coach-ci
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/)" = "401"
          curl --fail --silent --user auditor:secret http://127.0.0.1:18000/ > /dev/null
