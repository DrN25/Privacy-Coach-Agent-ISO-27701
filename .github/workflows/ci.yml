name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src knowledge_base tests

      - name: Lint
        run: ruff check src knowledge_base tests

      - name: Test
        run: pytest

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan Python source
        run: bandit -q -r src -x tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: privacy-coach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production container
        run: |
          docker run --rm -d --name privacy-coach-ci -p 18000:8000 \
            -e DATABASE_PATH=/var/data/test.db \
            -e OPENROUTER_API_KEY=test-key \
            -e APP_USERNAME=auditor \
            -e APP_PASSWORD=secret \
            privacy-coach:${{ github.sha }}
          trap 'docker stop privacy-coach-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/api/status; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs privacy-coach-ci
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/)" = "401"
          curl --fail --silent --user auditor:secret http://127.0.0.1:18000/ > /dev/null

      - name: Validate VPS deployment configuration
        env:
          APP_ENV_FILE: .env.production.example
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Skip commit superseded on main
        id: freshness
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.freshness.outputs.deploy == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Package and upload source
        if: steps.freshness.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=.venv \
            --exclude=src/data/*.db \
            --exclude=src/data/uploads \
            -czf "$RUNNER_TEMP/privacy-coach.tar.gz" .
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p ~/privacy-coach'
          scp -P "$VPS_PORT" "$RUNNER_TEMP/privacy-coach.tar.gz" \
            "$VPS_USER@$VPS_HOST:~/privacy-coach/source.tar.gz"

      - name: Build and deploy inside VPS
        if: steps.freshness.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/privacy-coach"
          release="$base/next"
          current="$base/current"
          test -f "$base/.env.production"
          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$base/source.tar.gz" -C "$release"
          cp "$base/.env.production" "$release/.env.production"
          chmod 600 "$release/.env.production"
          cd "$release"
          docker compose --project-name privacy-coach \
            --env-file .env.production -f docker-compose.prod.yml build --pull app
          docker compose --project-name privacy-coach \
            --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans --no-build
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' privacy-coach-app 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              rm -rf "$current"
              mv "$release" "$current"
              rm -f "$base/source.tar.gz"
              docker image prune -a -f \
                --filter "label=org.opencontainers.image.title=privacy-coach"
              docker compose --project-name privacy-coach \
                --env-file "$current/.env.production" -f "$current/docker-compose.prod.yml" ps
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$attempt" -eq 30 ]; then
              docker logs --tail=200 privacy-coach-app || true
              exit 1
            fi
            sleep 2
          done
          REMOTE
